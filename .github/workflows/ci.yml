name: CI

# A cada push e pull request: tipos, testes de regra e de banco, build e testes de ponta a ponta.
on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: painel
          POSTGRES_PASSWORD: painel
          POSTGRES_DB: painel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Postgres descartável do próprio CI (o schema "painel" é criado pelos testes)
      TEST_DATABASE_URL: postgres://painel:painel@127.0.0.1:5432/painel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes de regra e de banco (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Navegador dos testes de ponta a ponta
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta (Playwright)
        run: npm run test:e2e
      - name: Relatório dos testes de ponta a ponta
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
