<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão · Painel de Vendas</title>
<style>
  :root { --bg: #faf8f5; --text: #3c3c3a; --text-2: #6b655e; --accent: #d71921; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171513; --text: #f3efe9; --text-2: #c9c1b6; --accent: #d71921; color-scheme: dark; } }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 0 16px;
         background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; text-align: center; }
  img { width: 56px; height: 56px; border-radius: 16px; }
  h1 { font-size: 1.25rem; margin: 16px 0 4px; }
  p { color: var(--text-2); font-size: .875rem; margin: 0 0 24px; }
  a { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 999px; font-size: .875rem; font-weight: 500; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Sem conexão</h1>
    <p>Verifique sua internet para ver as vendas.</p>
    <a href="/dashboard">Tentar novamente</a>
  </main>
</body>
</html>
